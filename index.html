<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Márcia Manicure">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a4264f">
<title>Márcia Manicure</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: app de uma coluna (máx 480px), abas fixas embaixo, folhas (bottom sheets) para formulários */
  :root {
    --bg: #faf6f7;
    --card: #ffffff;
    --fg: #2a1d22;
    --muted: #7d6a71;
    --line: #eadfe3;
    --accent: #a4264f;       /* esmalte "cereja" */
    --accent-soft: #f7e3ea;
    --accent-fg: #ffffff;
    --ok: #1f8a4c;
    --ok-soft: #e1f3e8;
    --warn: #b86a00;
    --warn-soft: #fbefd9;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(60, 20, 35, .06), 0 4px 14px rgba(60, 20, 35, .05);
    --f-display: "Young Serif", Georgia, "Times New Roman", serif;
    --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1316; --card: #251b1f; --fg: #f4e9ed; --muted: #b39da6; --line: #3a2c32;
      --accent: #ef7fa3; --accent-soft: #3d2029; --accent-fg: #2a0f19;
      --ok: #5fcf8c; --ok-soft: #1c3326; --warn: #f0b14d; --warn-soft: #3a2c14; --danger: #f07a6e;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1316; --card: #251b1f; --fg: #f4e9ed; --muted: #b39da6; --line: #3a2c32;
    --accent: #ef7fa3; --accent-soft: #3d2029; --accent-fg: #2a0f19;
    --ok: #5fcf8c; --ok-soft: #1c3326; --warn: #f0b14d; --warn-soft: #3a2c14; --danger: #f07a6e;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; }
  body { padding-inline: 16px !important; }
  #app { max-width: 480px; margin: 0 auto; padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }

  .card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }

  /* Calendário */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav button { background: none; border: 0; color: var(--accent); font-size: 26px; line-height: 1; padding: 4px 12px; }
  .cal-title { font-weight: 700; font-size: 16px; }
  .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-week div { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .cal-day { aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cal-day.out { visibility: hidden; }
  .cal-day.today { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .cal-day:hover { background: var(--accent-soft); }
  .dots { display: flex; gap: 2px; height: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .dot.pend { background: var(--warn); }
  .dot.pago { background: var(--ok); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; justify-content: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
  .kpi b { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi.warn b { color: var(--warn); }

  .alert { border-radius: 14px; padding: 12px 14px; background: var(--warn-soft); }
  .alert.info { background: var(--accent-soft); }
  .alert-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(0,0,0,.06); }
  .alert-item:first-of-type { border-top: 0; }
  .alert-item .grow { font-size: 14px; }
  .alert-item small { color: var(--muted); display: block; }

  /* Lista de atendimentos */
  .appt { display: flex; gap: 12px; }
  .appt-time { font-weight: 700; font-size: 16px; width: 52px; flex-shrink: 0; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .appt-name { font-weight: 700; font-size: 16px; }
  .appt-serv { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .appt-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 0; }
  .pill.pend { background: var(--warn-soft); color: var(--warn); }
  .pill.pago { background: var(--ok-soft); color: var(--ok); }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chipbtn { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .chipbtn.accent { color: var(--accent); }
  .chipbtn.danger { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
  .empty strong { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }

  .btn { border: 0; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 15px; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.ghost { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; font-size: 15px; }

  /* Abas */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 10; }
  .tabs-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab { background: none; border: 0; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--accent); }

  /* Folha (modal) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(20, 8, 12, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 13px; font-weight: 600; color: var(--muted); }
  input[type=text], input[type=tel], input[type=date], input[type=time], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-size: 16px; }
  textarea { min-height: 72px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 12px; font-size: 14px; }
  .chip small { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .chip.on small { color: inherit; opacity: .8; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px; font-weight: 700; }
  .seg button.on.pend { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .seg button.on.pago { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 13px; font-weight: 700; font-size: 16px; }
  .pay button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; color: var(--muted); }
  .sumrow.big { color: var(--fg); font-size: 17px; border-top: 0; padding-top: 6px; }
  .help { font-size: 12px; color: var(--muted); margin: 0; }

  /* Clientes / serviços */
  .list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .list-item:first-child { border-top: 0; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; text-align: center; }
  .logo { width: min(210px, 60%); height: auto; color: var(--accent); display: block; }
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .wk button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-weight: 700; }
  .wk button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .pill.falta { background: var(--line); color: var(--muted); }
  .card.faltou { opacity: .6; }
  .card.faltou .appt-name { text-decoration: line-through; }
  .bloq-card { background: repeating-linear-gradient(135deg, var(--card) 0 10px, var(--bg) 10px 20px); box-shadow: none; border: 1px dashed var(--line); }
  .bloq-card .appt-name { color: var(--muted); }
  .cal-day.bloq { color: var(--muted); text-decoration: line-through; }
  .dot.bloq { background: var(--muted); opacity: .5; }
  .linkish { background: none; border: 0; padding: 0; text-align: left; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .cli-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; font-size: inherit; }
  .cli-open .grow b { display: block; }
  .ficha-top { display: flex; align-items: center; gap: 14px; margin: 10px 0 10px; }
  .avatar.big { width: 56px; height: 56px; font-size: 20px; }
  .obs { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-style: italic; margin-bottom: 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hist { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 0; text-align: left; font-size: 15px; }
  .hist:first-of-type { border-top: 0; }
  .hist-data { width: 58px; flex-shrink: 0; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
  .hist-data span { font-size: 12px; color: var(--muted); }
  .conf-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .conf-falta { font-size: 13px; font-weight: 700; color: var(--warn); }
  .conf-ok { font-size: 13px; font-weight: 700; color: var(--ok); }
  .conf-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .conf-item small { display: block; color: var(--muted); font-size: 13px; }
  .conf-hora { font-weight: 700; font-variant-numeric: tabular-nums; width: 48px; flex-shrink: 0; }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rep { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .seg2 button, .rep button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font-weight: 700; font-size: 15px; }
  .seg2 button.on, .rep button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .ultima { margin: -6px 0 0; font-size: 14px; color: var(--accent); }
  details summary { list-style: none; }
  .durbox { display: flex; align-items: center; gap: 10px; }
  .durbox button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 26px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .durval { flex: 1; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .durval b { display: block; font-size: 20px; }
  .durval small { color: var(--muted); font-size: 12px; }
  .serv-box { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .serv-box input[data-serv="nome"] { font-weight: 700; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .slots button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 0; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .slots button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .appt-time small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .serv-row { display: grid; grid-template-columns: 1fr 96px 36px; gap: 8px; align-items: center; }
  .icon-btn { background: none; border: 0; color: var(--muted); font-size: 20px; padding: 6px; }
  .search { margin-bottom: 12px; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } .sheet.noanim { animation: none; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
<style>html,body{margin:0} :root{padding-top:env(safe-area-inset-top,0px)} [hidden]{display:none!important}</style>
</head>
<body>
<div id="app"></div>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in">
    <button class="tab" data-tab="agenda" id="tab-agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</button>
    <button class="tab" data-tab="clientes" id="tab-clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg>Clientes</button>
    <button class="tab" data-tab="ajustes" id="tab-ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5h8M9 3.5v4.2L7.2 10a2 2 0 0 0-.4 1.2V19a1.5 1.5 0 0 0 1.5 1.5h7.4a1.5 1.5 0 0 0 1.5-1.5v-7.8a2 2 0 0 0-.4-1.2L15 7.7V3.5"/></svg>Serviços</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  // ---------------- Dados ----------------
  var KEY = 'agendaManicure_v1';
  var SERVICOS_PADRAO = [
    ['Pé e mão', 45, 90], ['Mão', 30, 40], ['Pé', 30, 40], ['Spa dos pés', 40, 60]
  ];
  var DURACOES = [15, 20, 30, 40, 45, 50, 60, 75, 90, 105, 120, 150, 180];
  function durTxt(m) { m = m || 0; var h = Math.floor(m / 60), r = m % 60; return h ? h + 'h' + (r ? pad(r) : '') : r + ' min'; }
  function min(h) { var p = String(h || '0:0').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function hhmm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function novoEstado() {
    return {
      servicos: SERVICOS_PADRAO.map(function (s) { return { id: uid(), nome: s[0], preco: s[1], dur: s[2] }; }),
      clientes: [], atend: {}, negocio: { nome: '', abre: '08:00', fecha: '19:00', zap: '(21) 96445-1344' }
    };
  }
  var S;
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!S || !S.servicos) S = novoEstado();
  S.servicos.forEach(function (x) { if (!x.dur) x.dur = 60; });
  if (S.negocio && !S.negocio.zap) S.negocio.zap = '(21) 96445-1344';
  S.bloqueios = S.bloqueios || [];
  S.atend = S.atend || {}; S.clientes = S.clientes || []; S.negocio = S.negocio || { nome: '', pix: '' };
  var podeSalvar = true;
  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { if (podeSalvar) { toast('Não consegui salvar neste navegador. Use o backup em Serviços.'); podeSalvar = false; } }

    }).join('') + '</div></div>';
    if (f.serv.length) {
      var dp = durPadrao(), dd = durServ(), cN = cliente(f.clienteId), nomeC = cN ? cN.nome.split(' ')[0] : '';
      var temDela = cN && cN.durs && f.serv.some(function (id) { return cN.durs[id]; });
      h += '<div class="field"><span>Quanto tempo vai levar</span><div class="durbox"><button type="button" data-act="fDur" data-v="-10" aria-label="Menos 10 minutos">−</button><div class="durval"><b>' + durTxt(dd) + '</b><small>' +
        (f.durManual ? 'só neste horário' : temDela ? 'tempo da ' + esc(nomeC) : 'tempo normal') + '</small></div><button type="button" data-act="fDur" data-v="10" aria-label="Mais 10 minutos">+</button></div>' +
        (f.durManual ? '<div class="row" style="gap:14px;flex-wrap:wrap"><button class="back" style="font-size:14px" data-act="fDurVolta">Voltar para ' + durTxt(dp) + '</button>' +
          (cN && f.serv.length === 1 ? '<button class="back" style="font-size:14px" data-act="fDurSalva">Usar sempre com a ' + esc(nomeC) + '</button>' : '') + '</div>' : '') + '</div>';
    }
    var dur = durServ();
    h += '<div class="field"><span>Horário' + (dur ? ' livre (' + durTxt(dur) + ')' : '') + '</span>';
    if (f.manualHora) h += '<input type="time" id="fHora" value="' + esc(f.hora) + '"><button class="back" style="align-self:flex-start;font-size:14px" data-act="fHoraLista">Ver horários livres</button>';
    else if (!dur) h += '<p class="help" style="font-size:14px">Escolha o serviço primeiro para ver os horários livres.</p>';
    else {
      var livres = horariosLivres(dur);
      if (f.hora && livres.indexOf(f.hora) < 0 && f.id) { livres.push(f.hora); livres.sort(); }
      h += livres.length ? '<div class="slots">' + livres.map(function (x) { return '<button type="button" class="' + (x === f.hora ? 'on' : '') + '" data-act="fSlot" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>'
        : '<p class="help" style="font-size:14px">Não tem horário livre neste dia para esse serviço.</p>';
      h += '<button class="back" style="align-self:flex-start;font-size:14px" data-act="fHoraManual">Digitar outro horário</button>';
    }
    h += '</div>';
    h += '<label class="field"><span>Valor total (R$)</span><input type="text" id="fValor" inputmode="decimal" value="' + (f.valor ? String(f.valor.toFixed(2)).replace('.', ',') : '') + '" placeholder="Soma sozinha pelos serviços"></label>';
    h += '<div class="field"><span>Forma de pagamento</span><div class="pay">' + FORMAS.map(function (x) { return '<button type="button" class="' + (f.forma === x ? 'on' : '') + '" data-act="fForma" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div></div>';
    h += '<div class="two" style="margin-top:4px"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="salvarAtend">Salvar</button></div>';
    if (f.id) h += '<button class="btn block" style="background:none;color:var(--danger)" data-act="delAtend" id="btnDelAtend">Apagar este horário</button>';
    abrirSheet(h);
  }
  function lerForm() {
    var f = form; var e;
    if ((e = document.getElementById('fCli'))) f.clienteId = e.value;
    if ((e = document.getElementById('fHora'))) f.hora = e.value;
    if (f.hora && !f.manualHora && !f.id) { var d = durServ(); if (d && horariosLivres(d).indexOf(f.hora) < 0) f.hora = ''; }
    if ((e = document.getElementById('fValor'))) { var v = lerValor(e.value); if (v !== f.valor) { f.valor = v; f.manual = true; } }
    if ((e = document.getElementById('fNovaNome'))) { f.nNome = e.value; f.nTel = document.getElementById('fNovaTel').value; }
  }
  function durDela(cid, sid) { var c = cliente(cid), s = servico(sid); return (c && c.durs && c.durs[sid]) || (s ? s.dur || 0 : 0); }
  function durPadrao() { var t = 0; form.serv.forEach(function (id) { t += durDela(form.clienteId, id); }); return t; }
  function durServ() { return form.durManual || durPadrao(); }
  function horariosLivres(dur) {
    var abre = min(S.negocio.abre || '08:00'), fecha = min(S.negocio.fecha || '19:00');
    var ocup = ocupado(diaSel, form.id);
    var cand = {};
    for (var m = abre; m <= fecha; m += passo()) cand[m] = 1;
    ocup.forEach(function (o) { cand[o[1]] = 1; });
    return Object.keys(cand).map(Number).sort(function (a, b) { return a - b; }).filter(function (m) {
      if (m < abre || m + dur > fecha) return false;
      return ocup.every(function (o) { return m + dur <= o[0] || m >= o[1]; });
    }).map(hhmm);
  }
  function somaServ() { var t = 0; form.serv.forEach(function (id) { var s = servico(id); if (s) t += s.preco; }); return t; }
  function salvarAtend() {
    lerForm(); var f = form;
    if (f.novaCli) {
      var nome = (f.nNome || '').trim(); if (!nome) { toast('Escreva o nome da cliente.'); return; }
      var c = { id: uid(), nome: nome, tel: (f.nTel || '').trim(), obs: '', retorno: '' }; S.clientes.push(c); f.clienteId = c.id;
    }
    if (!f.clienteId) { toast('Escolha a cliente.'); return; }
    if (!f.serv.length && !f.valor) { toast('Escolha pelo menos um serviço ou escreva o valor.'); return; }
    if (!f.hora) { toast('Escolha o horário.'); return; }
    var dados = { clienteId: f.clienteId, hora: f.hora, servIds: f.serv.slice(), servNomes: f.serv.map(function (id) { var s = servico(id); return s ? s.nome : ''; }).filter(Boolean), valor: f.valor, forma: f.forma, dur: durServ() || 60 };
    if (!dados.servNomes.length) dados.servNomes = ['Atendimento'];
    S.atend[diaSel] = S.atend[diaSel] || [];
    if (f.id) { var a = acharAtend(f.id); Object.keys(dados).forEach(function (k) { a[k] = dados[k]; }); }
    else { dados.id = uid(); S.atend[diaSel].push(dados); }
    salvar(); fecharSheet(); render(); toast(f.id ? 'Horário atualizado' : 'Horário marcado');
  }

  // Cliente
  var cliEdit = null;
  function abrirCliente(id) {
    var c = id ? cliente(id) : { nome: '', tel: '', obs: '', retorno: '' };
    cliEdit = id || null;
    var h = '<h2>' + (id ? 'Editar cliente' : 'Nova cliente') + '</h2>' +
      '<label class="field"><span>Nome</span><input type="text" id="cNome" value="' + esc(c.nome) + '" placeholder="Ex: Ana Paula"></label>' +
      '<label class="field"><span>WhatsApp</span><input type="tel" id="cTel" inputmode="tel" value="' + esc(c.tel) + '" placeholder="(11) 98765-4321"></label>' +
      '<label class="field"><span>Observações</span><textarea id="cObs" placeholder="Ex: alergia a acetona, gosta de nude, unha fraca">' + esc(c.obs) + '</textarea></label>' +
      '<details' + (c.durs && Object.keys(c.durs).length ? ' open' : '') + '><summary class="help" style="cursor:pointer;font-size:14px;color:var(--accent);font-weight:600">Tempo diferente com esta cliente</summary><div class="stack" style="margin-top:10px">' +
      '<p class="help">Se com ela algum serviço leva mais ou menos tempo, escolha aqui. Os horários livres vão levar isso em conta.</p>' +
      S.servicos.map(function (s) { var v = (c.durs && c.durs[s.id]) || 0; return '<label class="field"><span>' + esc(s.nome) + '</span><select data-cdur="' + s.id + '"><option value="0">Normal (' + durTxt(s.dur) + ')</option>' +
        DURACOES.concat(v && DURACOES.indexOf(v) < 0 ? [v] : []).sort(function (a, b) { return a - b; }).filter(function (d) { return d !== s.dur; }).map(function (d) { return '<option value="' + d + '"' + (d === v ? ' selected' : '') + '>' + durTxt(d) + '</option>'; }).join('') + '</select></label>'; }).join('') +
      '</div></details>' +
      '<div class="two"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="salvarCli">Salvar</button></div>' +
      (id ? '<button class="btn block" style="background:none;color:var(--danger)" data-act="delCli" id="btnDelCli">Apagar cliente</button>' : '');
    abrirSheet(h);
  }
  function salvarCliente() {
    var nome = document.getElementById('cNome').value.trim(); if (!nome) { toast('Escreva o nome da cliente.'); return; }
    var d = { nome: nome, tel: document.getElementById('cTel').value.trim(), obs: document.getElementById('cObs').value.trim(), retorno: '', durs: {} };
    document.querySelectorAll('[data-cdur]').forEach(function (sel) { if (+sel.value) d.durs[sel.dataset.cdur] = +sel.value; });
    if (cliEdit) { var c = cliente(cliEdit); Object.keys(d).forEach(function (k) { c[k] = d[k]; }); }
    else { d.id = uid(); S.clientes.push(d); }
    salvar(); fecharSheet(); render(); toast('Cliente salva');
  }

  // Recibo
  function recibo(a) {
    var c = cliente(a.clienteId) || { nome: 'Cliente' };
    var linhas = ['RECIBO' + (S.negocio.nome ? ' — ' + S.negocio.nome : ''), '', 'Cliente: ' + c.nome, 'Data: ' + dataCurta(diaSel) + '/' + diaSel.slice(0, 4) + (a.hora ? ' às ' + a.hora : '')];
    linhas.push('');
    (a.servIds || []).forEach(function (id, i) { var s = servico(id); linhas.push('• ' + (a.servNomes[i] || (s && s.nome)) + (s ? ' — ' + dinheiro(s.preco) : '')); });
    linhas.push('', 'Total: ' + dinheiro(a.valor), 'Pago no ' + (a.forma || 'Pix') + '. Obrigada!');
    return linhas.join('\n');
  }
  function abrirRecibo(id) {
    var a = acharAtend(id), c = cliente(a.clienteId) || {}; var txt = recibo(a); var lk = whats(c.tel, txt);
    abrirSheet('<h2>Recibo</h2><textarea id="reciboTxt" style="min-height:220px;font-size:14px" readonly>' + esc(txt) + '</textarea>' +
      '<div class="two"><button class="btn ghost" data-act="copRecibo">Copiar</button>' + (lk ? '<a class="btn primary" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="' + esc(lk) + '">Enviar no WhatsApp</a>' : '<button class="btn ghost" data-act="fechar">Fechar</button>') + '</div>' +
      (lk ? '<button class="btn ghost block" data-act="fechar">Fechar</button>' : ''));
  }

  // ---------------- Cliques ----------------
  var confirmando = null;
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
    if (t.dataset.tab) { tela = t.dataset.tab; busca = ''; render(); window.scrollTo(0, 0); return; }
    var act = t.dataset.act, id = t.dataset.id;
    switch (act) {
      case 'mes': mesVis.setMonth(mesVis.getMonth() + Number(t.dataset.d)); render(); break;
      case 'dia': diaSel = t.dataset.k; var dd = deChave(diaSel); mesVis = new Date(dd.getFullYear(), dd.getMonth(), 1); tela = 'dia'; render(); window.scrollTo(0, 0); break;
      case 'voltar': tela = 'agenda'; render(); break;
      case 'tab': tela = t.dataset.v; render(); window.scrollTo(0, 0); break;
      case 'ficha': cliSel = id; tela = 'ficha'; fecharSheet(); render(); window.scrollTo(0, 0); break;
      case 'faltou': var af = acharAtend(id); if (af) { af.faltou = !af.faltou; salvar(); render(); toast(af.faltou ? 'Marcado que ela faltou' : 'Certo, ela veio'); } break;
      case 'confZap': var ac = acharEm(t.dataset.k, id); if (ac) { ac.confirmado = true; salvar(); setTimeout(render, 500); } break;
      case 'bloquear': bform = null; abrirBloqueio(); break;
      case 'bNome': lerBloq(); bform.nome = t.dataset.v; abrirBloqueio(); break;
      case 'bTodo': lerBloq(); bform.diaTodo = t.dataset.v === '1'; abrirBloqueio(); break;
      case 'bRep': lerBloq(); bform.rep = t.dataset.v; abrirBloqueio(); break;
      case 'salvarBloq': salvarBloqueio(); break;
      case 'desbloq':
        if (confirmando !== 'b' + id) { confirmando = 'b' + id; t.textContent = 'Toque de novo'; return; }
        S.bloqueios = S.bloqueios.filter(function (x) { return x.id !== id; }); salvar(); render(); toast('Bloqueio apagado'); break;
      case 'desbloqDia': var bb = acharBloq(id); if (bb) { bb.exc = bb.exc || []; bb.exc.push(diaSel); salvar(); render(); toast('Liberado só neste dia'); } break;
      case 'fazerBackup': fazerBackup(); break;
      case 'confRestore': try { restaurarTexto(restorePendente); fecharSheet(); } catch (err) { toast('Não consegui ler essa cópia.'); } break;
      case 'novo': abrirAtend(null); break;
      case 'editar': abrirAtend(id); break;
      case 'recibo': abrirRecibo(id); break;
      case 'copRecibo': copiar(document.getElementById('reciboTxt').value, 'Recibo copiado'); break;
      case 'fechar': fecharSheet(); break;
      case 'fServ':
        lerForm(); var i = form.serv.indexOf(id); if (i >= 0) form.serv.splice(i, 1); else form.serv.push(id);
        if (!form.manual || form.id === null) { form.valor = somaServ(); form.manual = false; }
        desenharAtend(); break;
      case 'fDur': lerForm(); var nd = Math.max(10, durServ() + (+t.dataset.v)); form.durManual = nd === durPadrao() ? 0 : nd; desenharAtend(); break;
      case 'fDurVolta': lerForm(); form.durManual = 0; desenharAtend(); break;
      case 'fDurSalva':
        lerForm(); var cS = cliente(form.clienteId), sid = form.serv[0];
        if (cS && sid) { cS.durs = cS.durs || {}; var sv = servico(sid); if (sv && form.durManual === sv.dur) delete cS.durs[sid]; else cS.durs[sid] = form.durManual; form.durManual = 0; salvar(); toast('Guardado: ' + (sv ? sv.nome : '') + ' da ' + cS.nome.split(' ')[0] + ' leva ' + durTxt(durPadrao())); }
        desenharAtend(); break;
      case 'fSlot': lerForm(); form.hora = t.dataset.v; desenharAtend(); break;
      case 'fHoraManual': lerForm(); form.manualHora = true; desenharAtend(); break;
      case 'fHoraLista': lerForm(); form.manualHora = false; desenharAtend(); break;
      case 'fForma': lerForm(); form.forma = t.dataset.v; desenharAtend(); break;
      case 'fCliNova': lerForm(); form.novaCli = true; desenharAtend(); break;
      case 'fCliExist': lerForm(); form.novaCli = false; desenharAtend(); break;
      case 'salvarAtend': salvarAtend(); break;
      case 'delAtend':
        if (confirmando !== 'a' + form.id) { confirmando = 'a' + form.id; t.textContent = 'Toque de novo para apagar'; return; }
        S.atend[diaSel] = S.atend[diaSel].filter(function (x) { return x.id !== form.id; }); if (!S.atend[diaSel].length) delete S.atend[diaSel];
        salvar(); fecharSheet(); render(); toast('Horário apagado'); break;
      case 'novoCli': abrirCliente(null); break;
      case 'importar': importarContatos(); break;
      case 'linkLivres': abrirLinkLivres(); break;
      case 'status': abrirStatus(); break;
      case 'compStatus': compartilharStatus(); break;
      case 'folga': var fl = S.negocio.folga = S.negocio.folga || [], v = +t.dataset.v, ix = fl.indexOf(v); if (ix >= 0) fl.splice(ix, 1); else fl.push(v); salvar(); render(); break;
      case 'copLink': copiar(document.getElementById('linkTxt').value, 'Link copiado'); break;
      case 'editCli': abrirCliente(id); break;
      case 'salvarCli': salvarCliente(); break;
      case 'delCli':
        if (confirmando !== 'c' + cliEdit) { confirmando = 'c' + cliEdit; t.textContent = 'Toque de novo para apagar (os horários dela continuam)'; return; }
        var cc = cliente(cliEdit);
        Object.keys(S.atend).forEach(function (k) { S.atend[k].forEach(function (x) { if (x.clienteId === cliEdit) x.clienteNome = cc.nome; }); });
        S.clientes = S.clientes.filter(function (x) { return x.id !== cliEdit; }); salvar(); fecharSheet(); render(); toast('Cliente apagada'); break;
      case 'addServ': S.servicos.push({ id: uid(), nome: 'Novo serviço', preco: 0, dur: 60 }); salvar(); render(); var ins = document.querySelectorAll('[data-serv="nome"]'); var last = ins[ins.length - 1]; last.focus(); last.select(); break;
      case 'delServ':
        if (confirmando !== 's' + id) { confirmando = 's' + id; t.textContent = '✓'; t.style.color = 'var(--danger)'; toast('Toque no ✓ para apagar o serviço'); return; }
        S.servicos = S.servicos.filter(function (x) { return x.id !== id; }); salvar(); render(); break;
      case 'backup': fazerBackup(); break;
      case 'restaurar': pedirRestore(document.getElementById('restoreTxt').value); break;
    }
    confirmando = null;
  });
  // Edição de serviços e dados do negócio (salva ao sair do campo)
  var restorePendente = null;
  function pedirRestore(txt) {
    var novo;
    try { novo = JSON.parse(String(txt || '').trim()); if (!novo || !novo.servicos || !novo.clientes) throw 0; }
    catch (err) { toast('Essa não é uma cópia válida da agenda.'); return; }
    restorePendente = txt;
    var n = 0; Object.keys(novo.atend || {}).forEach(function (k) { n += novo.atend[k].length; });
    abrirSheet('<h2>Recuperar a agenda?</h2><p class="sub">A cópia tem ' + novo.clientes.length + ' clientes e ' + n + ' horários' + (novo.ultimoBackup ? ', guardada em ' + dataCurta(chave(new Date(novo.ultimoBackup))) : '') + '. Ela vai substituir o que está no app agora.</p>' +
      '<div class="two"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn primary" data-act="confRestore">Recuperar</button></div>');
  }
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fCli') { lerForm(); desenharAtend(); return; }
    if (t.id === 'restoreFile' && t.files && t.files[0]) { var fr = new FileReader(); fr.onload = function () { pedirRestore(fr.result); }; fr.readAsText(t.files[0]); t.value = ''; return; }
    if (t.dataset.serv) { var s = servico(t.dataset.id); if (!s) return; if (t.dataset.serv === 'nome') s.nome = t.value.trim() || s.nome; else if (t.dataset.serv === 'dur') s.dur = +t.value; else s.preco = lerValor(t.value); salvar(); render(); toast('Salvo'); }
    else if (t.id === 'negPasso') { S.negocio.passo = +t.value; salvar(); toast('Salvo'); }
    else if (t.id === 'negAbre' || t.id === 'negFecha' || t.id === 'negZap') { S.negocio.zap = document.getElementById('negZap').value.trim(); S.negocio.abre = document.getElementById('negAbre').value || '08:00'; S.negocio.fecha = document.getElementById('negFecha').value || '19:00'; salvar(); toast('Salvo'); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharSheet(); });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  var tinhaSW = !!navigator.serviceWorker.controller, recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (tinhaSW && !recarregou && !document.querySelector('.sheet')) { recarregou = true; location.reload(); }
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
    }).catch(function () {});
  });
}
</script>
